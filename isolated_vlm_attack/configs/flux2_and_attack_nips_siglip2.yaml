# Flux2 Klein black-box AND attack preset for SigLIP 2.
# Usage:
#   CONFIG=configs/flux2_and_attack_nips_siglip2.yaml ./run_vlm_attack.sh
#   HF_TOKEN=... CONFIG=configs/flux2_and_attack_nips_siglip2.yaml ./run_vlm_attack.sh

script_path: flux2_attack_runner.py
hf_token_env: HF_TOKEN
dataset_root: data/nips2017
output_root: outputs
wandb_enable: false

run_args:
  attack_mode: and
  gcg_scene_vocab_prompts_per_strategy: 1
  gcg_scene_vocab_enabled_strategies: all
  dataset_root: data/nips2017
  dataset_name: nips2017
  output_root: outputs
  run_name: flux2_and_attack_q100_eval
  wandb_project: siglip2_flux2_and_attack_q100
  start_index: 0
  max_samples: 1000
  attack_only_clean_correct: true
  clean_correct_sample_size: 100
  clean_correct_sample_seed: 0

  # The short alias is normalized to google/siglip2-base-patch16-224 by
  # VictimModelAdapter and keeps the output directory name filesystem-safe.
  victim_model: siglip2
  device: cuda
  manual_seed: 0
  classifier_objective: logit_margin_max

  model_path: black-forest-labs/FLUX.2-klein-9b-kv
  cpu_offload: false
  prompt: "a photo of <class> in the background"
  gcg_word: background
  gcg_occurrence: 0
  gcg_steps: 50
  gcg_batch_size: 3
  max_victim_queries: 100
  height: 1024
  width: 1024
  num_inference_steps: 4
  max_sequence_length: 512
  gcg_candidate_source: gemma_scene_vocab
  gcg_scene_vocab_size: 3
  scene_fallback: outdoor

  wandb_mode: auto
  wandb_log_every: 1

  scene_vlm_backend: gemma4
  scene_vlm_model_id: google/gemma-4-E4B-it
  scene_vlm_device: auto
  scene_vlm_max_new_tokens: 4096
  scene_vlm_thinking: false
  scene_vlm_do_sample: false
  gcg_scene_llm_model_id: google/gemma-4-E4B-it
  gcg_scene_llm_thinking: false
  gcg_scene_llm_do_sample: true
  gcg_slot_candidate_max_words: 5
  gcg_early_stop_on_attack_success: true
  gcg_eval_naturalness_on_attack_success: true
  gcg_eval_naturalness_llm_thinking: false
