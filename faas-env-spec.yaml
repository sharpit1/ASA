base: "kau/pytorch-master (CUDA 13.0, provider-managed Python)"
system_pkgs: []
pip_phases:
  - - "diffusers==0.37.1"
    - "sentencepiece>=0.2,<1"
    - "protobuf>=5,<7"
    - "einops>=0.8,<1"
    - "PyYAML>=6,<7"
    - "tqdm>=4.66,<5"
    - "natsort>=8.4,<9"
    - "setproctitle>=1.3,<2"
    - "timm>=1.0,<2"
    - "adversarial-robustness-toolbox>=1.18,<2"
    - "pytorch-fid>=0.3,<1"
env:
  HF_HOME: ".cache/huggingface"
  TORCH_HOME: "ckpt/torch_hub"
run_commands:
  - "HF_TOKEN=<faas-secret> ./run_faas_source_transfer.sh"
weight_dirs:
  huggingface:
    path: ".cache/huggingface"
    source: "Hugging Face from_pretrained loaders"
    gated: true
  classifiers:
    path: "ckpt/torch_hub"
    source: "torchvision, timm, and Hugging Face model loaders"
    gated: false
smoke:
  import_names:
    - torch
    - torchvision
    - transformers
    - diffusers
    - timm
    - art
    - pytorch_fid
  gpu_tests:
    - cmd: >-
        python -c "import torch;
        torch.manual_seed(123);
        x=torch.arange(64,device='cuda',dtype=torch.float32).reshape(8,8);
        y=x@x.T;
        torch.cuda.synchronize();
        print('CUDA_WITNESS',tuple(y.shape),float(y.sum()),torch.cuda.get_device_name())"
      expect: "^CUDA_WITNESS "
  cli_checks:
    - nvidia-smi
